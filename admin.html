<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLP Operator Desk</title><style>
:root{--paper:#e5ded1;--paper2:#f4efe6;--ink:#292520;--soft:#91887d;--red:#8a3328}*{box-sizing:border-box}body{margin:0;background:#cfc6b8;color:var(--ink);font-family:Georgia,"Times New Roman",serif}main{width:min(1000px,calc(100% - 24px));margin:18px auto;background:var(--paper);padding:18px}h1{font-size:54px;line-height:.9;font-weight:500;margin:8px 0 20px}.mono,button,input,.meta{font-family:"Courier New",monospace}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px}.auth{display:flex;gap:8px}input,button{border:1px solid var(--ink);background:var(--paper2);padding:10px;border-radius:0}button{font-size:9px;text-transform:uppercase;cursor:pointer}.dark{background:var(--ink);color:var(--paper2)}.notice{padding:12px 0;font:10px/1.4 "Courier New",monospace;text-transform:uppercase;color:var(--soft)}.item{padding:18px 0;border-top:1px solid var(--ink);display:grid;grid-template-columns:1fr auto;gap:18px}.item h2{font-size:28px;font-weight:500;margin:3px 0 7px}.item p{margin:0 0 9px;max-width:700px}.meta{font-size:9px;text-transform:uppercase;color:var(--soft)}.actions{display:flex;flex-direction:column;gap:7px;min-width:110px}.pending{color:var(--red)}@media(max-width:650px){.top,.item{display:grid;grid-template-columns:1fr}.auth{display:grid}.actions{flex-direction:row;flex-wrap:wrap}h1{font-size:44px}}
</style></head><body><main><div class="top"><div><div class="mono" style="font-size:10px;text-transform:uppercase">Milady Line Printer / private</div><h1>Operator desk</h1></div><div class="auth"><input id="key" type="password" placeholder="Admin key"><button id="load" class="dark">Load queue</button></div></div><div id="status" class="notice">Admin key is stored only in this browser session.</div><div id="list"></div></main>
<script>const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));key.value=sessionStorage.getItem('mlp-admin-key')||'';async function loadQ(){const k=key.value.trim();if(!k)return;sessionStorage.setItem('mlp-admin-key',k);const r=await fetch('/api/admin-classifieds',{headers:{authorization:`Bearer ${k}`}}),d=await r.json().catch(()=>({}));if(!r.ok){status.textContent=d.error||'Could not load queue';return}status.textContent=`${d.items.length} records loaded`;list.innerHTML=d.items.map(x=>`<article class="item"><div><div class="meta ${x.status==='pending'?'pending':''}">${e(x.category)} / ${e(x.status)} / ${new Date(x.created_at).toLocaleString()}</div><h2>${e(x.headline)}</h2><p>${e(x.body)}</p><div class="meta">${x.handle?e(x.handle)+' / ':''}expires ${new Date(x.expires_at).toLocaleDateString()} ${x.featured?' / FEATURED':''}</div></div><div class="actions"><button data-id="${x.id}" data-action="approve" class="dark">Approve</button><button data-id="${x.id}" data-action="reject">Reject</button><button data-id="${x.id}" data-action="${x.featured?'unfeature':'feature'}">${x.featured?'Unfeature':'Feature'}</button><button data-id="${x.id}" data-action="delete">Delete</button></div></article>`).join('')}async function act(id,action){const k=key.value.trim();if(action==='delete'&&!confirm('Delete permanently?'))return;const r=await fetch('/api/admin-classifieds',{method:'PATCH',headers:{'content-type':'application/json',authorization:`Bearer ${k}`},body:JSON.stringify({id,action})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Action failed');return}loadQ()}load.onclick=loadQ;list.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b)act(b.dataset.id,b.dataset.action)});</script></body></html>
